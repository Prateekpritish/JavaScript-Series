<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="button">Button Clicked</button>
<script>
    class React{
        constructor(){
            this.library = "React"
            this.server = "https://localhost:3000"

            document.querySelector('#button').addEventListener('click',this.handleclick.bind(this)) // this bind function takes the context -> this was necessary because when we direct wrote  to get something from function  using onclick property directly around button it gives errors creates problem
        }
        handleclick(){
            console.log("button clicked")
            console.log(`${this.server}`)
        }
    }
    const app = new React()
</script>    
</body>
</html>
